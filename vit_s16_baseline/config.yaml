# ============================================================
# Configuration for the ViT-S/16 SUPERVISED BASELINE
# (6-class indoor room classification, Places365 subset)
# ------------------------------------------------------------
# This file holds ALL tunable parameters. `train.py` reads it,
# copies it into the run folder as `config_used.yaml`, and also
# stores it inside every checkpoint, so any experiment can be
# reproduced or resumed exactly.
#
# NOTE: Center Loss (Part 2) IS implemented and is toggled by
# `use_center_loss` below. Pseudo-labeling / self-labeling (Part 3)
# is not implemented yet. The model returns CLS embeddings, which
# Center Loss uses and Part 3 will plug into.
# ============================================================

run_name: "vit_s16_baseline"      # used to name the experiment folder

model:
  image_size: 256
  patch_size: 16
  in_channels: 3
  embed_dim: 384                  # ViT-S
  depth: 12                       # number of transformer encoder blocks
  num_heads: 6                    # head_dim = 384 / 6 = 64
  mlp_ratio: 4.0
  dropout: 0.1                    # dropout in MLP / projection / positional
  attn_dropout: 0.0               # dropout applied to attention weights
  qkv_bias: true
  num_classes: 6

data:
  # Three roles: train (fit weights), val (best-model selection during training),
  # eval = TEST (final reporting only, via evaluate.py). If val_dir is omitted,
  # validation falls back to eval_dir (the old single-split behaviour).
  train_dir: "/content/drive/MyDrive/dissertation_dataset/train"
  val_dir:   "/content/drive/MyDrive/dissertation_dataset/val"
  eval_dir:  "/content/drive/MyDrive/dissertation_dataset/eval"
  # Fixed, explicit class order. Index = position in this list.
  class_names:
    - bathroom
    - bedroom
    - dining_room
    - entrance_hall
    - kitchen
    - living_room
  # Normalization statistics. ImageNet defaults are a fine, standard
  # choice even when training from scratch (they only rescale inputs).
  norm_mean: [0.485, 0.456, 0.406]
  norm_std:  [0.229, 0.224, 0.225]

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.05
  seed: 42
  num_workers: 2
  use_amp: true                   # mixed precision (only active on CUDA)
  scheduler: "cosine"             # "cosine" or "none"
  warmup_epochs: 5                # linear LR warmup before cosine decay
  label_smoothing: 0.1            # passed to CrossEntropyLoss
  grad_clip: 1.0                  # max grad-norm; set to null to disable
  save_epoch_checkpoints: false   # if true, also keep checkpoints/epoch_XXX.pt
  eval_every: 1                   # evaluate every N epochs

  # --- Center Loss (Wen et al. 2016) -- Part 2 of the thesis -----------
  # When enabled, total loss = CrossEntropy + center_loss_weight * CenterLoss.
  # The class centers are learnable, updated by their own SGD optimizer.
  # IMPORTANT (implementation note): the center gradients still carry the
  # center_loss_weight factor, so the EFFECTIVE center learning rate is
  # center_loss_lr * center_loss_weight. Changing lambda therefore also
  # changes how fast the centers move -- a known coupling, so the lambda
  # sweep is partly confounded by it. This is a valid Center Loss variant.
  #
  # RESULT OF THE CLEAN SWEEP (validation-selected, test-reported): Center Loss
  # did NOT improve accuracy at any weight tested. Validation accuracy falls
  # monotonically as lambda rises -- 0.5683 at lambda=0, then 0.5628, 0.5594,
  # 0.5206 for 0.0005, 0.001, 0.01 -- and test accuracy follows the same trend.
  # The default below therefore stays OFF, and the value 0.0005 is kept only
  # because it is the least harmful setting, used for the Part-3 experiments
  # where the specification requires Center Loss to be active.
  # (An earlier comment here called 0.001 "best in our sweep". That came from
  # the superseded protocol, which selected the best epoch on the test set and
  # inflated the numbers. It is not supported by the corrected results.)
  use_center_loss: false         # false = plain supervised baseline
  center_loss_weight: 0.0005     # lambda: weight of the center term
  center_loss_lr: 0.5            # base LR for the centers (effective = this * lambda)

paths:
  # Run folders (checkpoints/logs/outputs) are created under here.
  # On Colab, point this at Google Drive so results survive disconnects.
  output_root: "/content/drive/MyDrive/dissertation_runs"
