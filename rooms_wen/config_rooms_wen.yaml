# ==================================================================
# CENTRE UPDATE RULE -- COMPARISON ON THE ROOM DATASET
# ------------------------------------------------------------------
# The question this folder answers is the one left open by the FER
# experiment: on the dataset the thesis is actually about, is the
# variant used throughout this project better or worse than the rule
# as published by Wen et al.?
#
# Each rule is run exactly as defined. Neither is adjusted to make
# the comparison neater:
#
#   "none"      cross-entropy only. The control. With seed 42 it must
#               match 2026-07-11_17-49_vit_s16_3200_baseline closely
#               (validation 0.5683, test 0.5633). This folder has its
#               own training loop, so this is a consistency check: an
#               important difference must be investigated before the
#               other arms are interpreted. Bit-for-bit equality is
#               not expected, since the historical run used a
#               different runtime, GPU and PyTorch build.
#
#   "gradient"  the variant used in this thesis. Centres are ordinary
#               parameters stepped by SGD on the combined objective,
#               so lambda multiplies the centre gradient and the sum
#               over the batch is divided by the batch size B.
#               Displacement per step is proportional to
#               eta_c * lambda / B.
#
#   "wen"       the original centre-update rule, Equation (4) and
#               Algorithm 1 of Wen et al.:
#               a dedicated update with its own rate alpha,
#               independent of lambda, normalised per class by
#               (1 + n_j). Displacement per step is proportional to
#               alpha / (1 + n_j). Only the centre update is taken
#               from the paper: the paper writes its losses as sums
#               and trains with SGD, while this project averages over
#               the batch and uses AdamW, so the training procedure as
#               a whole is not a reproduction of the paper.
#
# WHAT THE COMPARISON MEASURES HERE, AND WHAT IT DOES NOT
# ------------------------------------------------------------------
# The ratio of the two displacements is  alpha * B / (eta_c * lambda
# * (1 + n_j)), where n_j is the number of images of class j in the
# current batch. On FER2013, evaluated at each class's expected count
# in a batch of 64 drawn from 28,709 training images, that ratio is
# about 64,910 for the rare "disgust" class against about 7,492 for
# the common "happy" class -- a nine-fold spread driven by class
# frequency. The FER result is consistent with that mechanism; that
# experiment did not isolate it, so it is not evidence that the
# per-class normalisation is what produced the effect.
#
# The room dataset is balanced: 3,200 images in every class. That
# removes the systematic difference between classes, but it does not
# make the ratio constant. n_j is hypergeometric, with mean 10.67 and
# standard deviation 2.98 at B = 64, so the ratio is about 10,971 at
# the mean and moves between roughly 8,741 and 14,729 within one
# standard deviation, batch by batch and class by class.
#
# So balancing removes the systematic frequency difference between
# classes; it does not remove the per-batch fluctuation, and the Wen
# rule still normalises per class. This experiment does not separate
# the normalisation from the large difference in effective rate. It
# compares the two complete rules at the hyperparameters each is used
# with, which is the question being asked.
#
# `compare_rooms_wen.py` overrides `run_name`, `center_mode` and
# `seed`; everything else is taken from this file unchanged.
# ==================================================================

run_name: "rooms_wen_baseline_s42"     # overridden per variant by the runner

model:
  # Guard value: rooms_wen_model.py refuses any config not declaring this.
  arch: vit_s16_rooms_wen
  # Every structural value below is copied from the config of the run being
  # reproduced, 2026-07-11_17-49_vit_s16_3200_baseline.
  image_size: 256
  patch_size: 16
  in_channels: 3
  embed_dim: 384                  # the CLS width Center Loss operates on
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.1
  attn_dropout: 0.0
  qkv_bias: true
  num_classes: 6

data:
  train_dir: "/content/dataset_split/train"
  val_dir:   "/content/dataset_split/val"
  eval_dir:  "/content/dataset_split/eval"
  # Fixed, explicit class order. Index = position in this list.
  # Balanced by construction: 3,200 training images per class, so there is no
  # systematic frequency difference between classes -- though n_j still
  # fluctuates from batch to batch. See the note at the top of this file.
  class_names:
    - bathroom
    - bedroom
    - dining_room
    - entrance_hall
    - kitchen
    - living_room
  norm_mean: [0.485, 0.456, 0.406]
  norm_std:  [0.229, 0.224, 0.225]

training:
  # Identical to the 3200 runs, so the control can be checked against them.
  epochs: 50
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.05
  seed: 42                        # overridden per variant by the runner
  # Compared when a finished run is considered for reuse: the worker seeds
  # come from the loader's generator, so a different count means a
  # different augmentation stream. Set it here, not on the command line.
  num_workers: 2
  use_amp: true
  scheduler: "cosine"
  warmup_epochs: 5
  label_smoothing: 0.1
  grad_clip: 1.0

  # --- centre update ---------------------------------------------------
  # center_mode is overridden per variant: "none", "gradient" or "wen".
  center_mode: "none"
  # lambda. 0.0005 is the value from the sweep that came closest to the
  # baseline; the other two coefficients tested were further below it.
  center_loss_weight: 0.0005
  # eta_c in "gradient" mode, alpha in "wen" mode. Both rules are run at the
  # value each was used with: 0.5 here and 0.5 in the paper.
  center_loss_lr: 0.5

paths:
  output_root: "/content/drive/MyDrive/Dissertation_Thesis/dissertation_runs"
